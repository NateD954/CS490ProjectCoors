name: CI

# Runs on every push to main and on every pull request into main.
# Also runnable by hand from the Actions tab.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimum percentage of changed lines that must be covered by tests.
  # See docs/COVERAGE.md for the policy.
  CHANGED_CODE_THRESHOLD: 80

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back_End
    # The tests use fake databases and never call real services. These values only
    # exist so the app can be imported. They are not real keys.
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SECRET_KEY: placeholder.placeholder.placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      OPENWEBNINJA_API_KEY: placeholder
    steps:
      # Full history is needed so the coverage gate can compare against main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Back_End/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest -q --cov --cov-report=xml

      - name: Changed-code coverage gate
        if: github.event_name == 'pull_request'
        run: >
          diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=${{ env.CHANGED_CODE_THRESHOLD }}

  frontend-checks:
    name: Frontend checks (lint, test and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front_End/clerk-nextjs
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front_End/clerk-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Changed-code coverage gate
        if: github.event_name == 'pull_request'
        run: >
          pipx run diff-cover coverage/cobertura-coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=${{ env.CHANGED_CODE_THRESHOLD }}

      # next build also runs the TypeScript type check
      - name: Build
        run: npm run build
